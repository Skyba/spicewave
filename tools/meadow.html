<!doctype html>
<!-- Draws web/meadow.jpg, the picture shown during breaks. See tools/meadow.sh. -->
<meta charset="utf-8"><style>body{margin:0;background:#000}canvas{display:block}</style>
<canvas id="c" width="2400" height="1600"></canvas>
<script>
const W = 2400, H = 1600, g = c.getContext('2d');
let seed = 11;
const R = () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
const rr = (a, b) => a + (b - a) * R();
const mix = (a, b, t) => a.map((v, i) => v + (b[i] - v) * t);
const rgb = (v, a = 1) => `rgba(${v.map(Math.round).join(',')},${a})`;
const smooth = t => t * t * (3 - 2 * t);
function noise1(freqs, amps) { const ph = freqs.map(() => R() * 99); return x => freqs.reduce((s, f, i) => s + Math.sin(x * f + ph[i]) * amps[i], 0); }
const SUN = [1330, 500];

// Sky
let gr = g.createLinearGradient(0, 0, 0, 820);
[[0, '#79aebf'], [.3, '#aed0ca'], [.58, '#f0e0ba'], [.8, '#ffe3a8'], [1, '#f6d99a']].forEach(s => gr.addColorStop(...s));
g.fillStyle = gr; g.fillRect(0, 0, W, 900);
const glow = (x, y, r, col, a) => { const q = g.createRadialGradient(x, y, 0, x, y, r); q.addColorStop(0, rgb(col, a)); q.addColorStop(.4, rgb(col, a * .38)); q.addColorStop(1, rgb(col, 0)); g.fillStyle = q; g.fillRect(0, 0, W, H); };
glow(...SUN, 1050, [255, 236, 180], .85);
glow(...SUN, 260, [255, 250, 226], 1);
// Soft high clouds
g.filter = 'blur(26px)';
for (let i = 0; i < 46; i++) { const y = rr(60, 380); g.fillStyle = rgb([255, 244, 222], rr(.06, .2)); g.beginPath(); g.ellipse(rr(-100, W + 100), y, rr(120, 420), rr(8, 24), rr(-.06, .04), 0, 7); g.fill(); }
g.filter = 'none';

// Mountains
[[560, 150, [156, 182, 180]], [620, 105, [128, 162, 156]], [668, 70, [104, 144, 132]]].forEach(([base, amp, col], k) => {
  const n = noise1([.0016, .0041, .0093, .021, .047], [.62, .3, .16, .06, .025]);
  g.beginPath(); g.moveTo(0, H);
  for (let x = 0; x <= W; x += 4) g.lineTo(x, base - Math.abs(n(x)) * amp * 1.15 - amp * .15);
  g.lineTo(W, H); g.fillStyle = rgb(mix(col, [252, 228, 178], .24 - k * .05)); g.fill();
});
glow(SUN[0], 590, 900, [255, 232, 178], .42);

function mist(y, h, a, col = [250, 232, 190]) {
  const q = g.createLinearGradient(0, y - h, 0, y + h); q.addColorStop(0, rgb(col, 0)); q.addColorStop(.5, rgb(col, a)); q.addColorStop(1, rgb(col, 0));
  g.fillStyle = q; g.fillRect(0, y - h, W, h * 2);
}
// A distant pine: ragged silhouette
function far(x, y, h, col) {
  const w = h * rr(.17, .25), n = 10; g.fillStyle = col; g.beginPath(); g.moveTo(x, y - h);
  for (let s = 1; s >= -1; s -= 2) for (let k = 0; k <= n; k++) { const i = s > 0 ? k : n - k, t = i / n; g.lineTo(x + s * w * (t * .95 + .02) * rr(.75, 1.12), y - h + h * t * .97 + (s > 0 ? 2 : 0)); g.lineTo(x + s * w * t * .5, y - h + h * t * .97 + h * .018); }
  g.closePath(); g.fill();
}
// Forest bands, hazy to deep. The gap opens towards the sun.
[[706, 54, [132, 160, 138], .34], [736, 74, [106, 142, 114], .34], [768, 100, [80, 122, 92], .3], [804, 134, [58, 102, 72], .26], [846, 172, [38, 80, 54], .2]].forEach(([y, h, col, a], k) => {
  const n = noise1([.003, .009], [14, 7]);
  const tint = (x, v = 0) => mix(mix(col, [24, 58, 42], v), [236, 208, 140], Math.exp(-(((x - SUN[0]) / 560) ** 2)) * (.42 - k * .05));
  // the forest floor between the trunks
  const q = g.createLinearGradient(0, 0, W, 0); for (let u = 0; u <= 10; u++) q.addColorStop(u / 10, rgb(tint(u / 10 * W)));
  g.fillStyle = q; g.beginPath(); g.moveTo(0, H); for (let x = 0; x <= W; x += 8) g.lineTo(x, y + n(x) - h * .16); g.lineTo(W, H); g.fill();
  for (let r = 0; r < 2; r++) for (let x = -40; x < W + 40; x += h * rr(.1, .2)) {
    const open = Math.exp(-(((x - 1290) / (230 + k * 95)) ** 2)), hh = h * rr(.6, 1.2) * (1 - open * (.34 + k * .11)) * (r ? 1 : 1.08);
    far(x, y + n(x) + r * h * .12, hh, rgb(tint(x, (r ? .12 : 0) + R() * .2)));
  }
  mist(y + 8, 34 + k * 5, a);
});

// Meadow
const hz = x => 838 + Math.sin(x * .0021 + .6) * 16 + Math.sin(x * .0057) * 6;
g.beginPath(); g.moveTo(0, H); for (let x = 0; x <= W; x += 6) g.lineTo(x, hz(x)); g.lineTo(W, H); g.closePath();
gr = g.createLinearGradient(0, 820, 0, H);
[[0, '#d9cf86'], [.1, '#b9bf6b'], [.3, '#87a04f'], [.6, '#4f7a3c'], [1, '#21442a']].forEach(s => gr.addColorStop(...s));
g.fillStyle = gr; g.fill();
g.save(); g.clip();
g.globalCompositeOperation = 'soft-light'; glow(1300, 890, 1000, [255, 240, 170], .9);
g.globalCompositeOperation = 'source-over';
// rolling light and shade
g.filter = 'blur(22px)';
for (let i = 0; i < 70; i++) { const t = R(), y = 860 + t * 720; g.fillStyle = R() < .5 ? rgb([238, 226, 138], .1) : rgb([22, 60, 38], .12); g.beginPath(); g.ellipse(rr(0, W), y, rr(140, 480), 8 + t * 34, rr(-.06, .06), 0, 7); g.fill(); }
g.filter = 'none'; g.restore();
// long shadows from the trees at both sides
g.filter = 'blur(9px)';
for (let i = 0; i < 34; i++) { const left = R() < .5, x = left ? rr(-150, 640) : rr(1830, 2550), y = rr(905, 1090), dx = (x - SUN[0]) * rr(.5, .9), w = rr(10, 30); g.fillStyle = rgb([20, 52, 36], .2); g.beginPath(); g.moveTo(x - w, y); g.lineTo(x + w, y); g.lineTo(x + dx + w * 3, y + rr(180, 380)); g.lineTo(x + dx - w, y + 220); g.fill(); }
g.filter = 'none';

// A detailed pine: whorls of drooping branches with needles, lit on the sunny side
function pine(x, y, h, dark, light, haze = 0) {
  const sunny = x < SUN[0] ? 1 : -1, hz = [228, 208, 152], w = h * rr(.2, .25), lean = rr(-.012, .012) * h, at = t => y - h * .985 + h * .9 * t;
  g.lineCap = 'round'; g.strokeStyle = rgb(mix([44, 36, 27], hz, haze));
  g.beginPath(); g.moveTo(x, y); g.lineTo(x, y - h * .5); g.lineWidth = Math.max(1.5, h * .02); g.stroke();
  g.strokeStyle = rgb(mix(dark, hz, haze)); g.beginPath(); g.moveTo(x, y - h * .5); g.lineTo(x + lean, y - h); g.lineWidth = Math.max(.8, h * .0024); g.stroke();
  // a dark core so the sky does not show through
  g.fillStyle = rgb(mix(dark, hz, haze), .9); g.beginPath(); g.moveTo(x + lean, at(.02));
  for (let t = .05; t <= 1; t += .05) g.lineTo(x + lean * (1 - t) + w * t * .6 * rr(.75, 1.05), at(t));
  for (let t = 1; t >= .05; t -= .05) g.lineTo(x + lean * (1 - t) - w * t * .6 * rr(.75, 1.05), at(t)); g.fill();
  const whorls = Math.round(17 + h * .016);
  for (let i = whorls; i >= 0; i--) {
    const t0 = i / whorls, full = rr(.82, 1.12), per = 13;
    for (let b = 0; b < per; b++) {
      // an angle around the trunk: the sides reach out, the front ones come last
      const face = -1 + 2 * ((b * .618 + i * .37) % 1), t = Math.min(1, Math.max(.004, t0 + rr(-.45, .45) / whorls)), s = Math.sign(face) || 1, out = Math.abs(face);
      const reach = w * (.02 + t) * full * rr(.72, 1.08), len = reach * (.22 + .78 * Math.sqrt(out)), drop = reach * (.16 + (1 - out) * .34), bx = x + lean * (1 - t), by = at(t);
      const steps = Math.max(3, Math.round(len / (1.6 + h * .0019))), nl = h * .021 * (.3 + .7 * Math.sqrt(t)) * rr(.75, 1.1);
      const lit = Math.max(0, .34 + face * sunny * .46 + rr(-.2, .2));
      for (let k = 0; k <= steps; k++) {
        const u = k / steps, px = bx + s * len * u, py = by + drop * (u * u * .9 - .22 * Math.sin(u * 3.1));
        g.strokeStyle = rgb(mix(mix(dark, light, lit * (.12 + u * u * .88)), hz, haze), .9); g.lineWidth = Math.max(.6, h * .0017);
        g.beginPath(); g.moveTo(px, py); g.lineTo(px + s * nl * rr(.35, .95), py + nl * rr(.1, .7)); g.moveTo(px, py); g.lineTo(px + s * nl * rr(-.1, .4), py + nl * rr(.6, 1.1)); g.moveTo(px, py); g.lineTo(px + s * nl * rr(.3, .8), py - nl * rr(.05, .4)); g.stroke();
      }
    }
  }
}
// Grass: far to near
function grass(y0, y1, n) {
  const a = []; for (let i = 0; i < n; i++) { const t = Math.pow(R(), .72); a.push([rr(-20, W + 20), y0 + (y1 - y0) * t]); } a.sort((p, q) => p[1] - q[1]);
  for (const [x, y] of a) {
    if (y < hz(x) + 4) continue;
    const t = (y - 838) / (H - 838), l = 3 + t * t * 74 * rr(.5, 1.2) + t * 12, bend = rr(-.35, .5) * l;
    const warm = Math.exp(-(((x - SUN[0]) / 800) ** 2)) * (1 - t * .7);
    let col = mix([176, 178, 92], [34, 82, 44], smooth(Math.min(1, t * 1.15))); col = mix(col, R() < .5 ? [226, 214, 126] : [26, 66, 40], R() * .38); col = mix(col, [250, 230, 150], warm * R() * .5);
    g.strokeStyle = rgb(col, .7); g.lineWidth = .7 + t * 2.1; g.beginPath(); g.moveTo(x, y); g.quadraticCurveTo(x + bend * .2, y - l * .6, x + bend, y - l); g.stroke();
  }
}
g.filter = 'blur(5px)'; for (let x = 0; x < W; x += 7) { const warm = Math.exp(-(((x - SUN[0]) / 700) ** 2)); g.fillStyle = rgb(mix([88, 122, 72], [222, 204, 124], warm * .8), .55); g.beginPath(); g.ellipse(x, hz(x) + rr(-5, 5), rr(8, 22), rr(3, 9), 0, 0, 7); g.fill(); } g.filter = 'none';
mist(846, 40, .3);
grass(842, 1120, 19000);
// Forest edge on both sides, back to front, leaving the middle open
const trees = [];
for (let i = 0; i < 58; i++) { const left = i % 2, d = R(), y = 868 + d * 130, edge = 1 - Math.pow(R(), 1.3); trees.push([left ? -60 + edge * (760 - d * 300) : W + 60 - edge * (720 - d * 260), y, rr(250, 400) + d * 190, d]); }
for (const x of [905, 985, 1720, 1650, 1585]) trees.push([x + rr(-14, 14), 868 + rr(0, 16), rr(150, 230), 0]);
trees.sort((a, b) => a[1] - b[1]);
let misted = 0;
for (const [x, y, h, d] of trees) { if (y > 925 && !misted++) mist(905, 60, .26); pine(x, y, h, mix([40, 80, 58], [18, 48, 36], d), mix([176, 176, 98], [118, 148, 72], d), .3 * (1 - d)); }
mist(1000, 70, .1);
grass(960, 1330, 21000);

// Wildflowers
function flowers(n, y0, y1) {
  const cols = [[255, 250, 236], [255, 222, 110], [206, 176, 232], [248, 178, 168]], patch = Array.from({ length: 34 }, () => [rr(0, W), rr(y0, y1), rr(90, 260), cols[Math.floor(Math.pow(R(), 1.4) * 4)]]), a = [];
  for (let i = 0; i < n; i++) { const p = patch[Math.floor(R() * patch.length)], an = R() * 7, r = Math.sqrt(R()) * p[2]; a.push([p[0] + Math.cos(an) * r * 1.7, p[1] + Math.sin(an) * r * .42, p[3]]); }
  a.sort((p, q) => p[1] - q[1]);
  for (const [x, y, col] of a) {
    if (y < 905 || y > H + 10) continue; const t = (y - 838) / (H - 838), s = .9 + t * t * 8.5;
    const cx = x, cy = y - t * 46 * rr(.5, 1.1);
    if (t > .3) { g.strokeStyle = rgb([58, 100, 52], .75); g.lineWidth = .7 + t * 1.4; g.beginPath(); g.moveTo(x, y + 8); g.lineTo(cx, cy); g.stroke(); }
    g.fillStyle = rgb(mix(col, [70, 98, 62], R() * .22), .92);
    if (s < 3) { g.beginPath(); g.ellipse(cx, cy, s, s * .75, 0, 0, 7); g.fill(); }
    else { const tilt = rr(.5, .85); for (let k = 0; k < 6; k++) { const an = k * 1.047 + x; g.beginPath(); g.ellipse(cx + Math.cos(an) * s * .62, cy + Math.sin(an) * s * .62 * tilt, s * .52, s * .34 * tilt, Math.atan2(Math.sin(an) * tilt, Math.cos(an)), 0, 7); g.fill(); } g.fillStyle = rgb([214, 150, 46]); g.beginPath(); g.ellipse(cx, cy, s * .32, s * .28 * tilt, 0, 0, 7); g.fill(); }
  }
}
flowers(1500, 930, 1340);
grass(1180, 1600, 15000);
flowers(620, 1240, 1600);

// Light through the clearing
g.save(); g.globalCompositeOperation = 'screen'; g.filter = 'blur(34px)';
for (let i = 0; i < 11; i++) { const a = rr(.2, 2.94), l = rr(700, 1250), s = rr(.018, .055); g.fillStyle = rgb([255, 230, 160], rr(.035, .085)); g.beginPath(); g.moveTo(...SUN); g.lineTo(SUN[0] + Math.cos(a - s) * l, SUN[1] + Math.sin(a - s) * l); g.lineTo(SUN[0] + Math.cos(a + s) * l, SUN[1] + Math.sin(a + s) * l); g.fill(); }
g.filter = 'none'; glow(SUN[0], SUN[1] + 60, 900, [255, 222, 150], .3); g.restore();

// Two near pines frame the scene
pine(90, 1420, 1330, [8, 28, 22], [74, 108, 56]);
pine(2325, 1470, 1420, [8, 28, 22], [74, 108, 56]);
pine(-130, 1560, 1500, [5, 20, 16], [40, 72, 44]);
grass(1380, 1640, 4200);

// Drifting seeds
for (let i = 0; i < 130; i++) { g.fillStyle = rgb([255, 244, 206], rr(.15, .6)); g.beginPath(); g.arc(rr(350, 2050), rr(640, 1320), rr(.8, 3), 0, 7); g.fill(); }
// Vignette into the frame colour
gr = g.createRadialGradient(W / 2, H * .5, 620, W / 2, H * .52, 1560); gr.addColorStop(0, 'rgba(12,32,24,0)'); gr.addColorStop(1, 'rgba(12,32,24,.56)'); g.fillStyle = gr; g.fillRect(0, 0, W, H);
// Fine grain
const im = g.getImageData(0, 0, W, H), dt = im.data; for (let i = 0; i < dt.length; i += 4) { const n = (R() - .5) * 9; dt[i] += n; dt[i + 1] += n; dt[i + 2] += n; } g.putImageData(im, 0, 0);
document.title = 'done';
</script>
